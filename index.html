<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo HeladeriaJyS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <header style="text-align: center; padding: 20px 10px;">
    <img src="logo.png" alt="Heladería JyS" style="width: 160px; height: auto; max-width: 80%; border-radius: 50%;">
    <h1 style="margin-top: 10px;">Catálogo HeladeriaJyS</h1>
    <p>Mayorista y minorista · La Plata y alrededores</p>
    <button id="openCart" class="cart-btn-header">🛒 Carrito (<span id="cartCount">0</span>)</button>
  </header>


  <main>
    <section class="info-banner">
      <div><strong>📦 Mayorista</strong> Ideal para kioscos y comercios</div>
      <div><strong>🛍️ Minorista</strong> También vendemos por unidad</div>
      <div><strong>🚚 Distribución</strong> La Plata y alrededores</div>
    </section>

    <section class="catalog">
      <h2>Nuestros Productos</h2>
      <div id="filters" class="filters"></div>
      <div id="products" class="products-grid"></div>
    </section>
  </main>

  <aside id="cart" class="cart-sidebar">
    <div class="cart-header">
      <h2>Tu Pedido</h2>
      <button id="closeCart">&times;</button>
    </div>
    <div id="cartItems" class="cart-body"></div>
    <div class="cart-footer">
      <div><span>Total estimado:</span> <strong id="cartTotal">$0</strong></div>
      <button id="whatsappBtn" class="wa-btn">Enviar pedido por WhatsApp</button>
    </div>
  </aside>

  <footer>
    <p><strong>HeladeríaJyS</strong> · La Plata y alrededores</p>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>

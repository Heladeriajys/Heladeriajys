
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#ff8fab">
  <meta name="description" content="Distribuidora de Helados JyS - Catálogo mayorista y minorista">

  <title>Distribuidora de Helados JyS - Catálogo Mayorista y Minorista</title>

  <link rel="stylesheet" href="style.css?v=8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- PANTALLA DE BIENVENIDA -->
  <div id="intro-screen" class="intro-screen">
    <div class="intro-content">

      <video
        class="intro-video"
        id="welcomeVideo"
        autoplay
        muted
        playsinline
        preload="auto"
      >
        <source src="bienvenida.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video.
      </video>

      <h2>¡Bienvenidos a Distribuidora de Helados JyS!</h2>
      <p>Mayorista y Minorista 🍦</p>

      <button id="enterCatalog" class="enter-catalog-btn">
        Ver catálogo 🛒
      </button>

    </div>
  </div>

  <!-- CATÁLOGO -->
  <div id="catalog-content" class="catalog-content">

    <header class="header">
      <div class="header-container">

        <div class="logo-area">
          <img src="logo.png" alt="Distribuidora de Helados JyS Logo" class="brand-logo">
          <h1 class="brand-title">Distribuidora de Helados JyS</h1>
          <span class="brand-subtitle">Mayorista y Minorista</span>
        </div>

        <button class="cart-btn-header" id="openCart">
          🛒 Carrito <span id="cartCount">(0)</span>
        </button>

      </div>
    </header>

    <main class="main-container">

      <section class="search-filter-section">

        <input
          type="text"
          id="searchInput"
          placeholder="Buscar helado o producto..."
          class="search-input"
        >

        <div class="filters-container" id="filters"></div>

      </section>

      <!-- AVISO COMPACTO BALDES DE 10 LITROS -->
      <a
        href="https://wa.me/5492214949199?text=Hola%2C%20quer%C3%ADa%20consultar%20por%20los%20baldes%20de%2010%20litros."
        target="_blank"
        rel="noopener noreferrer"
        style="
          display: block;
          max-width: 620px;
          margin: 12px auto;
          padding: 9px 12px;
          background: #fff5f8;
          border: 1px solid #ff8fab;
          border-radius: 12px;
          color: #d9577d;
          text-align: center;
          text-decoration: none;
          font-family: Poppins, sans-serif;
          font-size: 13px;
          font-weight: 600;
        "
      >
        🪣 ¿Buscás baldes de 10 litros? Consultanos por WhatsApp →
      </a>

      <section class="products-grid" id="products"></section>

    </main>

    <!-- CARRITO -->
    <div class="cart-sidebar" id="cartModal">

      <div class="cart-header">
        <h2>Tu Pedido</h2>
        <button class="close-btn" id="closeCart">&times;</button>
      </div>

      <div class="cart-content">

        <div id="cartItems" class="cart-items-list"></div>

        <div class="cart-summary">

          <div class="total-row">
            <span>Total:</span>
            <strong id="cartTotal">$0</strong>
          </div>

          <div
            id="minAmountNotice"
            class="min-amount-alert"
            style="display:none;"
          ></div>

          <div class="checkout-form">

            <label for="deliveryAddress">Dirección de entrega *</label>

            <input
              type="text"
              id="deliveryAddress"
              placeholder="Ej: Calle 60 #1234, Los Hornos"
              required
            >

            <label for="paymentMethod">Forma de pago</label>

            <select id="paymentMethod">
              <option value="Efectivo">Efectivo</option>
              <option value="Transferencia">Transferencia</option>
              <option value="Mercado Pago">Mercado Pago</option>
            </select>

            <label for="orderNotes">Aclaraciones o notas (Opcional)</label>

            <textarea
              id="orderNotes"
              placeholder="Ej: Timbre 2B..."
            ></textarea>

          </div>

          <button id="whatsappBtn" class="whatsapp-btn">
            Enviar pedido por WhatsApp
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- PRODUCTOS Y APLICACIÓN -->
  <script src="products.js?v=8"></script>
  <script src="app.js?v=9"></script>

  <!-- ENTRAR AL CATÁLOGO -->
  <script>
    const introScreen = document.getElementById("intro-screen");
    const catalogContent = document.getElementById("catalog-content");
    const enterButton = document.getElementById("enterCatalog");

    enterButton.addEventListener("click", function () {
      introScreen.classList.add("intro-hidden");
      catalogContent.classList.add("catalog-visible");
    });
  </script>

  <!-- ACTUALIZACIÓN AUTOMÁTICA DEL CATÁLOGO -->
  <script>
    if ("serviceWorker" in navigator) {

      let alreadyReloaded = false;
      const hadController = !!navigator.serviceWorker.controller;

      navigator.serviceWorker.addEventListener(
        "controllerchange",
        function () {
          if (hadController && !alreadyReloaded) {
            alreadyReloaded = true;
            window.location.reload();
          }
        }
      );

      window.addEventListener("load", async function () {
        try {
          const registration =
            await navigator.serviceWorker.register("./sw.js", {
              updateViaCache: "none"
            });

          await registration.update();

          console.log("Distribuidora de Helados JyS: actualizaciones activadas.");

        } catch (error) {
          console.log("No se pudo actualizar el catálogo:", error);
        }
      });

    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Heladería JyS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <div class="header-content">
      <img src="logo.png" alt="Heladería JyS" class="logo">
      <h1 class="title">Catálogo HeladeríaJyS</h1>
      <p class="subtitle">Mayorista y minorista · La Plata y alrededores</p>
      
      <button class="cart-btn-header" id="openCart">
        🛒 Carrito <span id="cartCount">(0)</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Buscador de productos -->
    <div class="search-container" style="margin: 20px 0 15px 0;">
      <input type="text" id="searchInput" placeholder="🔍 Buscar helado o producto..." style="width: 100%; padding: 12px 15px; border-radius: 25px; border: 2px solid #ffccd5; font-size: 1rem; outline: none; box-sizing: border-box;">
    </div>

    <!-- Filtros de Categorías -->
    <div class="filters" id="filters"></div>

    <!-- Lista de Productos -->
    <div class="products-grid" id="products"></div>
  </main>

  <!-- Panel del Carrito (Modal Lateral) -->
  <div class="cart-sidebar" id="cartModal">
    <div class="cart-header">
      <h2>Tu Pedido</h2>
      <button id="closeCart" class="close-btn">&times;</button>
    </div>

    <div class="cart-body" id="cartItems"></div>

    <div class="cart-footer">
      <!-- Selector de Forma de Pago -->
      <div class="payment-method" style="margin-bottom: 15px; text-align: left;">
        <label style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px;">💳 Forma de Pago:</label>
        <select id="paymentMethod" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem;">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia / Mercado Pago / Cuenta DNI">Transferencia / Mercado Pago / Cuenta DNI</option>
        </select>
      </div>

      <div class="cart-total-container">
        <span>Total:</span>
        <span id="cartTotal">$0</span>
      </div>
      <button class="whatsapp-send-btn" id="whatsappBtn">
        <i class="fab fa-whatsapp"></i> Enviar pedido por WhatsApp
      </button>
    </div>
  </div>

  <!-- Botón Flotante Directo a WhatsApp -->
  <a href="https://wa.me/5492213524121?text=¡Hola!%20Quisiera%20hacer%20una%20consulta." target="_blank" class="float-whatsapp" title="Consultar por WhatsApp" style="position: fixed; width: 60px; height: 60px; bottom: 25px; right: 25px; background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center; font-size: 30px; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); z-index: 100; display: flex; align-items: center; justify-content: center; text-decoration: none;">
    <i class="fab fa-whatsapp"></i>
  </a>

  <footer class="footer" style="text-align: center; padding: 20px; background: #333; color: #fff; margin-top: 40px;">
    <p>HeladeríaJyS · La Plata y alrededores</p>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
